name: cheesy_scribe
description: "Cheese tasting notes you'll pretend to remember. A TK ForgeWorks product."
publish_to: 'none'

# X.Y.Z[-rc.N]+BUILD. The release branch name (vX.Y.Z/main) is the source of
# X.Y.Z; scripts/release/bump-version.{sh,ps1} rewrites this line. BUILD is the
# Android versionCode and must go up on every APK that reaches a device.
version: 0.3.0+27

environment:
  sdk: ^3.13.2

dependencies:
  device_info_plus: ^13.3.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  # The shared tkforgeworks sign-in, account and data plumbing over Supabase
  # (CHEESE-59). Pinned to an exact tag like forge_ui; fixes go upstream.
  forge_core:
    git:
      url: https://github.com/tkforgeworks/forge-core.git
      ref: v0.1.0
  # The shared tkforgeworks theme, widgets and fonts. Pinned to an exact
  # release tag; fixes go into forge-ui and the pin moves (CHEESE-48).
  forge_ui:
    git:
      url: https://github.com/tkforgeworks/forge-ui.git
      ref: v0.2.0
  go_router: ^18.0.2
  heroicons: ^0.11.0
  http: ^1.6.0
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_schema: ^5.2.2
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/

# Launcher icon (CHEESE-18). Sources are rendered from the app's own brand
# widgets: see assets/brand/README.md for the regenerate recipe.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/launcher/icon-legacy.png
  min_sdk_android: 24
  adaptive_icon_background: "#FAF6EE"
  adaptive_icon_foreground: assets/brand/launcher/icon-foreground.png
  adaptive_icon_monochrome: assets/brand/launcher/icon-monochrome.png
