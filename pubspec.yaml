name: cheesy_scribe
description: "Cheese tasting notes you'll pretend to remember. A TK ForgeWorks product."
publish_to: 'none'

# X.Y.Z[-rc.N]+BUILD. The release branch name (vX.Y.Z/main) is the source of
# X.Y.Z; scripts/release/bump-version.{sh,ps1} rewrites this line. BUILD is the
# Android versionCode and must go up on every APK that reaches a device.
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  heroicons: ^0.11.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/licenses/

  # Fonts are bundled (see assets/fonts/LICENSES.md): static instances so
  # FontWeight selects the face directly; no google_fonts runtime fetch.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-It.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/SourceSerif4-SemiboldIt.ttf
          weight: 600
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
